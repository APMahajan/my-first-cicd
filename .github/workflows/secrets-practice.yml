name: Secrets Practice

on:
  workflow_dispatch:

jobs:
  secret-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Use secret safely
        env:
          MY_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ -n "$MY_PASSWORD" ]; then
            echo "Secret is configured successfully!"
          else
            echo "Secret is missing!"
          fi