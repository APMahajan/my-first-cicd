
name: My First Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Java code
        run: javac -d out src/Hello.java src/HelloTest.java

      - name: Run Java program
        run: java -cp out Hello

      - name: Run tests
        run: java -cp out HelloTest
