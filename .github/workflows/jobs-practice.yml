name: Jobs and Steps Practice

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Job
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Java version
        run: java -version

      - name: Show project files
        run: ls -la

  test:
    name: Test Job
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Announce test job
        run: echo "Build succeeded. Test job is running."